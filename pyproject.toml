[tool.poetry]
package-mode = false

[project]
name = "ebac-bookstore"
version = "0.1.0"
description = "BookStore API"
authors = [
    {name = "SrDev-Henrique",email = "halbuquerque2850@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "django-debug-toolbar (>=7.0.0,<8.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "basedpyright (>=1.29.0,<2.0.0)",
    "django-stubs (>=6.0.7,<7.0.0)",
    "djangorestframework-stubs (>=3.17.1,<4.0.0)"
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bookstore.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test", "*Tests", "*Suite"]
python_functions = ["test_*"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["."]
exclude = ["**/__pycache__", "**/migrations", ".venv"]

[[tool.pyright.executionEnvironments]]
root = "order"
extraPaths = ["."]
reportIncompatibleVariableOverride = false

[[tool.pyright.executionEnvironments]]
root = "order/tests"
extraPaths = ["."]
reportIncompatibleVariableOverride = false

[[tool.pyright.executionEnvironments]]
root = "product"
extraPaths = ["."]
reportIncompatibleVariableOverride = false

[[tool.pyright.executionEnvironments]]
root = "product/tests"
extraPaths = ["."]
reportIncompatibleVariableOverride = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
